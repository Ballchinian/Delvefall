#the daily card data update, and the one time initial seed: run it by hand from
#the actions tab and it fills an empty database from scratch

name: update card data

on:
    schedule:
        - cron: "0 9 * * *"  #9am utc every day, scryfall rebuilds their bulk files overnight
    workflow_dispatch:  #the "run workflow" button, for the initial seed or manual runs

jobs:
  update:
    runs-on: ubuntu-latest
    #github's own ceiling is 6 hours, which is no limit at all: a step whose
    #database connection is black holed holds a transaction the site's boot
    #queues behind, and on 09-22 that is what took the site down. the longest run
    #there has ever been is the first seed, 86 minutes against an empty database,
    #and no day's work since has passed 13
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      #the embedding model is ~1.2gb, no point pulling it from huggingface every day
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: mtg-tuned-embeddinggemma-300m

      #plain "pip install torch" grabs a 2gb+ cuda build this runner cannot use.
      #the cpu wheel FIRST means the requirements step sees torch satisfied.
      #the version matches the pin in ingest/requirements.txt, so the two cannot
      #disagree about which torch embedded the vectors already in the table
      - run: pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ingest/requirements.txt

      - run: python -m ingest.update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  #the tuned embedding model lives in a private hugging face repo
          PYTHONUNBUFFERED: "1"  #otherwise the log messages pile up and appear all at once at the end

      #the community tags for the concept axis
      - run: python -m ingest.tags
        #this step and the three below it do the same work against a full
        #database as against an empty one, and their worst over the last 26 runs
        #is 3.9 minutes. twenty is a hang rather than a slow day. the embedding
        #step above has no bar of its own: a reseed really does take 86 minutes,
        #so the job's own timeout is the only honest limit on it
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"

      #edhrec's salt survey. its own meta key, so it and the deck ingest cannot
      #skip each other. the survey runs yearly, so most days this changes nothing
      - run: python -m ingest.salt
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"

      #the precons a pasted deck's originality is compared against. keyed on
      #mtgjson's version rather than scryfall's timestamp, and it FOREIGN KEYS
      #into cards, so it needs the update step above to have filled that table
      - run: python -m ingest.decks
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"

      #which tags each line is about. LAST because it reads what both steps above
      #wrote, and unconditional because either one changing invalidates it
      - run: python -m ingest.attribute
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
