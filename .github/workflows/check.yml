#the gate in front of a deploy: railway ships main on push, so anything getting
#past this is live.
#
#compiling and the drift check between them still wave through a filter compiler
#that 500s on a half typed negation, or a line cleaner that quietly stopped
#stripping saga chapters, which is what the tests are for

name: check web copies

on:
    push:
    workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    #a throwaway postgres for the tests that need real rows. the pgvector image
    #is stock postgres with the extension built in, so schema.sql loads unchanged,
    #pg_trgm and all. it dies with the job, which is the point: the LIVE database
    #is never what a test writes to
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delvefall_test
        ports:
          - 5432:5432
        #without the health check the first connection races the server's own
        #startup, failing about one run in five and looking like a flaky test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      #PINNED, because the runner's own node moves under us: it arrived as 22
      #against code developed on 20, and the two disagree about what
      #`--test <directory>` means, so the suite passed locally and died here
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      #every python file, not just the ones the drift check reads. no imports and
      #no database, so it only asks whether the source PARSES
      - name: compile every python file
        run: python -m compileall -q common ingest finetune tools web tests

      #a parse error here is a page that renders and then does nothing, harder to
      #notice than a 500. --input-type=module because these are es modules and
      #the default check reads them as commonjs, where every import is a syntax error
      - name: check the javascript parses
        run: |
          for f in web/static/js/*.js; do
            node --input-type=module --check < "$f" || { echo "FAILED: $f"; exit 1; }
          done
          node --check web/static/cards.js

      #node's own runner, no install and no browser. tests/js/resolve.mjs is
      #node's half of the importmap in base.html, which is what lets these
      #modules be imported at all.
      #
      #the files BY NAME, not the folder: handed a directory, node 22 puts it
      #through module resolution, resolve.mjs passes it on, and the default
      #resolver refuses to import a directory
      - name: run the javascript tests
        run: node --import ./tests/js/register.mjs --test tests/js/*.test.mjs

      #stdlib only, nothing to install
      - run: python tools/check_sync.py

      #flask and flask-compress because web/app.py imports them at module level.
      #NOT web/requirements.txt, since gunicorn never runs here
      - name: install the test dependencies
        run: python -m pip install --quiet pytest flask flask-compress "psycopg[binary,pool]" pgvector

      #TEST_DATABASE_URL is what turns tests/conftest.py's stub into a real pool.
      #without it the suite skips everything needing rows, as it does on a laptop
      - name: run the tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delvefall_test
        run: python -m pytest tests -q
