#the gate in front of a deploy. railway ships main on push, so anything that
#gets past this is live, and until now the only thing being asked was whether
#the copies in web/ still matched their sources.
#
#that left the obvious hole wide open: a syntax error in web/app.py, the whole
#website, passed this workflow green and deployed. check_sync.py parses the
#handful of files it compares and nothing else, so app.py, db.py, visitors.py,
#views/, and half of ingest/ were never even read.
#
#so the drift check keeps its job and compiling comes first, because a file
#that does not parse cannot be compared anyway.
#
#the tests are the third thing and the only one that asks whether any of this
#WORKS. compiling catches a file that cannot be read and the drift check
#catches a copy that stopped matching, but between them they would wave through
#a filter compiler that 500s on a half typed negation or a line cleaner that
#quietly stopped stripping saga chapters. tests/conftest.py stubs the database
#out, so this needs three small packages and no postgres on the runner.

name: check web copies

on:
    push:
    workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    #a throwaway postgres for the tests that need real rows. the pgvector image
    #is the stock postgres one with the extension already built in, so
    #common/schema.sql loads unchanged, pg_trgm and all. it is EMPTY except for
    #what tests/seed.py puts in it and it dies with the job, which is the whole
    #point: the live database is never what a test writes to
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delvefall_test
        ports:
          - 5432:5432
        #without the health check the first connection races the server's own
        #startup, which fails maybe one run in five and looks like a flaky test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      #every python file in the repo, not just the ones the drift check reads.
      #-q keeps the log to the failures. no imports and no database: this asks
      #whether the source parses, which is the failure that takes the site down
      #without anyone having to be wrong about anything
      - name: compile every python file
        run: python -m compileall -q common ingest tools web tests

      #the browser modules get the same treatment. they are what draws the
      #results grid, the swap tool and the deck pages, and a parse error in one
      #is a page that renders and then does nothing, which is harder to notice
      #than a 500. node is already on the runner. --input-type=module because
      #these are es modules and the default check reads them as commonjs, where
      #every import line is a syntax error
      - name: check the javascript parses
        run: |
          for f in web/static/js/*.js; do
            node --input-type=module --check < "$f" || { echo "FAILED: $f"; exit 1; }
          done
          node --check web/static/cards.js

      #stdlib only, nothing to install
      - run: python tools/check_sync.py

      #flask and flask-compress because web/app.py imports them at module level,
      #pytest to run the thing, and the postgres pair for the service container
      #above. deliberately NOT web/requirements.txt: gunicorn never runs here
      - name: install the test dependencies
        run: python -m pip install --quiet pytest flask flask-compress "psycopg[binary,pool]" pgvector

      #TEST_DATABASE_URL is what turns tests/conftest.py's stub into a real
      #pool. without it the suite still runs and simply skips everything that
      #needs rows, which is how it behaves on a laptop with no postgres
      - name: run the tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delvefall_test
        run: python -m pytest tests -q
